services:
  lichess-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pinky-pawn-bot
    env_file:
      - .env
    volumes:
      # Mount local code for development (hot reload)
      - ./bot:/app/bot
      # Volume for logs
      - ./logs:/app/logs
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 1G
